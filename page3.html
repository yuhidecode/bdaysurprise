<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>7 Years 🧡</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #fff1df;
            font-family: "Trebuchet MS", sans-serif;
            color: #713b22;
        }

        .page {
            width: 100%;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
            position: relative;
        }

        .content {
            width: min(90%, 650px);
            text-align: center;

            animation: appear 1.2s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .small-text {
            font-size: 21px;
            margin-bottom: 12px;
        }

        .years {
            font-family: Georgia, serif;
            font-size: clamp(70px, 15vw, 120px);
            font-weight: bold;

            color: #e87525;

            line-height: 1;
            margin-bottom: 25px;

            animation: gentleBounce 3s ease-in-out infinite;
        }

        @keyframes gentleBounce {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-7px);
            }
        }

        .message {
            font-family: Georgia, serif;
            font-size: clamp(20px, 4vw, 27px);
            line-height: 1.7;
        }

        .highlight {
            color: #e87525;
            font-weight: bold;
        }

        .heart {
            font-size: 28px;
            margin-top: 25px;
        }

        .next-btn {
            display: inline-block;

            margin-top: 30px;

            padding: 12px 25px;

            background: #e87525;
            color: white;

            text-decoration: none;

            border-radius: 25px;

            font-size: 16px;
            font-weight: bold;

            transition: 0.3s;

            box-shadow: 0 6px 15px rgba(232, 117, 37, 0.2);
        }

        .next-btn:hover {
            transform: translateY(-3px);
            background: #d96218;
        }

        /* Floating decorations */

        .decoration {
            position: absolute;

            color: #e87525;
            font-size: 27px;

            animation: float 4s ease-in-out infinite;
        }

        .one {
            top: 15%;
            left: 12%;
        }

        .two {
            top: 20%;
            right: 13%;
            animation-delay: 1s;
        }

        .three {
            bottom: 17%;
            left: 15%;
            animation-delay: 2s;
        }

        .four {
            bottom: 20%;
            right: 14%;
            animation-delay: 1.5s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        @media (max-width: 600px) {

            .small-text {
                font-size: 18px;
            }

            .message {
                font-size: 20px;
            }

            .decoration {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <!-- Decorations -->

        <div class="decoration one">✦</div>
        <div class="decoration two">♡</div>
        <div class="decoration three">✧</div>
        <div class="decoration four">♡</div>


        <div class="content">

            <p class="small-text">
                Can you believe it's been
            </p>

            <div class="years">
                7 YEARS!!!
            </div>

            <p class="message">

                Like, how did we survive??? 😭

                <br><br>

                I'm glad we did. 🧡

                <br><br>

                Thank you for being friends w me
                when I wasn't even sure of what I was doing.

            </p>

            <div class="heart">
                🧡
            </div>

            <a href="page4.html" class="next-btn">
                there's more →
            </a>

        </div>

    </main>

</body>
</html>
